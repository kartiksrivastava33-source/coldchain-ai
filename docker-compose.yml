
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: coldchain-qdrant
    restart: unless-stopped

    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"

    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}

    volumes:
      - qdrant_storage:/qdrant/storage

    networks:
      - coldchain-network

volumes:
  qdrant_storage:
    name: coldchain_qdrant_storage

networks:
  coldchain-network:
    name: coldchain-network
